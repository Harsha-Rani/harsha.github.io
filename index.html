<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Filter Rules Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .rule-creator {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 1.1em;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            min-height: 40px;
            padding: 10px;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            background: white;
        }

        .keyword-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .keyword-tag .remove-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .keyword-tag .remove-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .rules-list {
            margin-top: 30px;
        }

        .rules-list h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .rule-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .rule-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .rule-folder {
            font-size: 1.2em;
            font-weight: 600;
            color: #667eea;
        }

        .rule-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .rule-keyword {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            color: #495057;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-size: 1.1em;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
        }

        .help-text {
            font-size: 0.85em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Filter Rules Manager</h1>
        
        <div class="rule-creator">
            <h2 style="color: #495057; margin-bottom: 20px;">Create New Rule</h2>
            
            <div class="form-group">
                <label for="folderName">Destination Folder:</label>
                <input type="text" id="folderName" placeholder="e.g., Important, Work, Personal, Archive" />
                <div class="help-text">Enter the folder name where emails should be moved</div>
            </div>

            <div class="form-group">
                <label for="keyword">Add Keywords:</label>
                <div class="input-group">
                    <input type="text" id="keyword" placeholder="Type keywords separated by commas: urgent, meeting, deadline" />
                    <button class="btn btn-primary" onclick="addKeyword()">Add Keywords</button>
                </div>
                <div class="help-text">💡 You can add one word OR multiple words separated by commas (e.g., "urgent, meeting, deadline")</div>
            </div>

            <div class="form-group">
                <label>Keywords in this rule:</label>
                <div class="keywords-container" id="keywordsContainer">
                    <span class="help-text" style="margin: auto;">No keywords added yet</span>
                </div>
            </div>

            <button class="btn btn-success" onclick="createRule()" style="width: 100%; margin-top: 20px;">
                ✓ Create Filter Rule
            </button>
        </div>

        <div class="rules-list">
            <h2>📋 Active Filter Rules</h2>
            <div id="rulesList"></div>
        </div>
    </div>

    <script>
        let currentKeywords = [];
        let rules = JSON.parse(localStorage.getItem('emailRules')) || [];

        // Display rules on page load
        displayRules();

        // Allow Enter key to add keyword
        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addKeyword();
            }
        });

        function addKeyword() {
            const keywordInput = document.getElementById('keyword');
            const input = keywordInput.value.trim();
            
            if (!input) return;
            
            // Split by commas and/or spaces, filter out empty strings
            const keywords = input
                .split(/[,\s]+/) // Split by comma or space
                .map(word => word.trim().toLowerCase())
                .filter(word => word.length > 0 && !currentKeywords.includes(word));
            
            if (keywords.length > 0) {
                currentKeywords.push(...keywords);
                displayKeywords();
                keywordInput.value = '';
                keywordInput.focus();
                
                // Show confirmation
                if (keywords.length === 1) {
                    console.log(`Added: ${keywords[0]}`);
                } else {
                    console.log(`Added ${keywords.length} keywords: ${keywords.join(', ')}`);
                }
            } else {
                alert('No new keywords to add (duplicates or empty input)');
            }
        }

        function displayKeywords() {
            const container = document.getElementById('keywordsContainer');
            
            if (currentKeywords.length === 0) {
                container.innerHTML = '<span class="help-text" style="margin: auto;">No keywords added yet</span>';
                return;
            }
            
            container.innerHTML = currentKeywords.map((keyword, index) => `
                <div class="keyword-tag">
                    <span>${keyword}</span>
                    <button class="remove-btn" onclick="removeKeyword(${index})">×</button>
                </div>
            `).join('');
        }

        function removeKeyword(index) {
            currentKeywords.splice(index, 1);
            displayKeywords();
        }

        function createRule() {
            const folderName = document.getElementById('folderName').value.trim();
            
            if (!folderName) {
                alert('Please enter a folder name');
                return;
            }
            
            if (currentKeywords.length === 0) {
                alert('Please add at least one keyword');
                return;
            }
            
            const newRule = {
                id: Date.now(),
                folder: folderName,
                keywords: [...currentKeywords],
                created: new Date().toLocaleString()
            };
            
            rules.push(newRule);
            saveRules();
            
            // Reset form
            document.getElementById('folderName').value = '';
            currentKeywords = [];
            displayKeywords();
            displayRules();
            
            alert(`✓ Rule created successfully!\n\nEmails containing: ${newRule.keywords.join(', ')}\nWill be moved to: ${newRule.folder}`);
        }

        function displayRules() {
            const rulesList = document.getElementById('rulesList');
            
            if (rules.length === 0) {
                rulesList.innerHTML = '<div class="empty-state">No filter rules yet. Create one above to get started!</div>';
                return;
            }
            
            rulesList.innerHTML = rules.map(rule => `
                <div class="rule-item">
                    <div class="rule-header">
                        <div>
                            <div class="rule-folder">📁 ${rule.folder}</div>
                            <div style="font-size: 0.85em; color: #6c757d; margin-top: 5px;">
                                Created: ${rule.created}
                            </div>
                        </div>
                        <button class="btn btn-delete" onclick="deleteRule(${rule.id})">Delete</button>
                    </div>
                    <div>
                        <strong style="color: #495057;">Keywords (${rule.keywords.length}):</strong>
                        <div class="rule-keywords">
                            ${rule.keywords.map(keyword => `
                                <span class="rule-keyword">${keyword}</span>
                            `).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e9ecef; font-size: 0.9em; color: #6c757d;">
                        ℹ️ Emails containing any of these words will be automatically moved to "${rule.folder}" folder
                    </div>
                </div>
            `).join('');
        }

        function deleteRule(ruleId) {
            if (confirm('Are you sure you want to delete this rule?')) {
                rules = rules.filter(rule => rule.id !== ruleId);
                saveRules();
                displayRules();
            }
        }

        function saveRules() {
            localStorage.setItem('emailRules', JSON.stringify(rules));
        }
    </script>
</body>
</html>
